<style>
/* Layout: barra superior con pestañas + área de trabajo a ancho completo; detalle de póliza en panel lateral */

}

  --red:#ff8a80; --red-soft:#4a1f1f; --orange:#ffb35c; --orange-soft:#45301a; --yellow:#e8cf5b; --yellow-soft:#3d3714;
  --green:#7fd18f; --green-soft:#1d3a24; --grey-soft:#24343a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}

.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-red{background:var(--red-soft);color:var(--red)} .s-orange{background:var(--orange-soft);color:var(--orange)}
.s-yellow{background:var(--yellow-soft);color:var(--yellow)} .s-green{background:var(--green-soft);color:var(--green)} .s-grey{background:var(--grey-soft);color:var(--muted)}

.card:hover{border-color:var(--accent)}
.card .row{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ins{display:grid;gap:8px}
.ins .nums{display:flex;gap:16px;font-size:.84rem}
.ins .nums b{font-family:var(--f-data);font-size:1.2rem;display:block}

.drawer-back{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}

  padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:grid;gap:14px;align-content:start}

.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.msg{font-size:.84rem;padding:8px 10px;border-radius:6px}
.msg.err{background:var(--red-soft);color:var(--red)} .msg.ok{background:var(--green-soft);color:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:30;font-weight:500}

<header class="top">

<script>
(function(){
const DAY=864e5;
const HOY=new Date(); HOY.setHours(0,0,0,0);
const ASEG=["SURA","Allianz","Seguros Bolívar","La Previsora","Mapfre","HDI Seguros","Equidad Seguros","Solidaria"];
const RAMOS=["Autos","Hogar","Responsabilidad civil","Cumplimiento","Pyme / Multirriesgo","Vida","Maquinaria y equipo","Transporte"];
const ESTADOS=["Por gestionar","Contactado","En cotización","Renovada","Cambió de aseguradora","No renovada"];
const VENTANA=90;
const KEY="srj-renovaciones-v1";

function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function addDays(n){return iso(new Date(HOY.getTime()+n*DAY))}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function dias(p){return Math.round((parse(p.fin)-HOY)/DAY)}
function plusYear(s){const d=parse(s);d.setFullYear(d.getFullYear()+1);return iso(d)}
function fmtFecha(s){if(!s)return"—";const d=parse(s);return d.toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}
function cop(n){return n||n===0?"$ "+Number(n).toLocaleString("es-CO"):"—"}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)}
function generales(r){return r!=="Autos"}

/* ---------- datos de ejemplo ---------- */
function seed(){
  const nombres=["Luz Marina Rincón","Jorge Eliécer Pérez","Transportes La Llanura S.A.S.","Diana Carolina Barrera","Ferretería El Tractor","Óscar Iván Cárdenas","María Fernanda Tumay","Agropecuaria Los Esteros S.A.S.","Henry Alexis Salcedo","Constructora Cravo Sur S.A.S.","Yuli Andrea Montaña","Carlos Arturo Patiño","Distribuidora Upía Ltda.","Nubia Esperanza Avella","Wilmer Fabián Chaparro","Sandra Milena Holguín","Arrocera Pore S.A.S.","Edwin Mauricio Ladino","Paola Andrea Vega","Servicentro Morichal","Germán Darío Cely","Leidy Johana Fonseca","Hotel Sirivana Yopal","Rubén Darío Mesa","Claudia Patricia Niño","Taller Mecánico El Cusiana","Fabio Nelson Tocaría","Ingrid Lorena Sossa"];
  const plan=[[-6,"Autos"],[-2,"Cumplimiento"],[3,"Autos"],[5,"Hogar"],[8,"Responsabilidad civil"],[11,"Autos"],[14,"Pyme / Multirriesgo"],[18,"Autos"],[21,"Maquinaria y equipo"],[24,"Autos"],[27,"Hogar"],[33,"Autos"],[36,"Cumplimiento"],[40,"Vida"],[44,"Autos"],[48,"Transporte"],[52,"Autos"],[57,"Pyme / Multirriesgo"],[63,"Autos"],[68,"Hogar"],[74,"Autos"],[79,"Responsabilidad civil"],[85,"Autos"],[96,"Autos"],[130,"Hogar"],[175,"Autos"],[240,"Cumplimiento"],[300,"Autos"]];
  const est=["Por gestionar","Por gestionar","Contactado","En cotización","Por gestionar","Contactado","Por gestionar","En cotización","Por gestionar","Contactado","Por gestionar","Por gestionar","Contactado","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Por gestionar","Renovada","Renovada","Renovada"];
  const placas=["KTR482","FXQ913","HLM207","JYO554","DQS860","LMN331","GTP118","NRV745","EZK609","BWJ272","CUX438","PAZ916","RSO153","TYH680"];
  let pi=0;
  return plan.map(([d,ramo],i)=>{
    const fin=addDays(d), ini=iso(new Date(parse(fin).setFullYear(parse(fin).getFullYear()-1)));
    const aseg=ASEG[(i%4)+4*((i>>4)&1)];
    const valor=ramo==="Autos"?(45+((i*17)%90))*1e6:ramo==="Vida"?200e6:(80+((i*37)%400))*1e6;
    const prima=Math.round(valor*(ramo==="Autos"?0.034:ramo==="Cumplimiento"?0.012:0.006)/1000)*1000;
    const p={id:uid(),numero:(1000+i*7)+"-"+(30000+i*913),aseguradora:aseg,ramo,cliente:nombres[i],cedula:String(74180000+i*48271).slice(0,8),
      correo:i===9?"":nombres[i].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g,"").trim().split(" ").slice(0,2).join(".")+"@correo.com",
      celular:i===16?"":"31"+String(20000000+i*3511973).slice(0,8),placa:ramo==="Autos"?placas[pi++%placas.length]:"",valor,prima,inicio:ini,fin,estado:est[i],renovadaEl:"",
      gestiones:[{f:ini,t:"Registro",n:"Póliza registrada al momento de la expedición."}],cotizaciones:[],docs:["Carátula póliza "+ini.slice(0,4)+".pdf"],historial:[],solicitud:{}};
    if(p.estado==="Contactado")p.gestiones.push({f:addDays(-3),t:"WhatsApp",n:"Se envió recordatorio de vencimiento. Cliente pide que le coticen."});
    if(p.estado==="En cotización"){p.gestiones.push({f:addDays(-5),t:"Llamada",n:"Cliente quiere comparar precio con otra compañía."});p.cotizaciones.push({a:ASEG[(i*3+1)%ASEG.length],prima:Math.round(prima*0.93/1000)*1000,n:"Mismo amparo, deducible 10%"});}
    if(p.estado==="Renovada"){p.renovadaEl=addDays(-(i-22)*4);p.historial.push({f:p.renovadaEl,a:aseg,prima:Math.round(prima*0.95/1000)*1000});p.gestiones.push({f:p.renovadaEl,t:"Renovación",n:"Renovada con "+aseg+"."});}
    return p;
  });
}
let DB;
function load(){try{const s=localStorage.getItem(KEY);if(s){DB=JSON.parse(s);return}}catch(e){} DB={polizas:seed(),solicitudes:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
load();

/* ---------- reglas ---------- */
function estadoEf(p){
  if((p.estado==="Renovada"||p.estado==="Cambió de aseguradora")&&dias(p)<=VENTANA&&p.renovadaEl&&(HOY-parse(p.renovadaEl))/DAY>180)return"Por gestionar";
  return p.estado;
}
function cerrado(p){const e=estadoEf(p);return e==="Renovada"||e==="Cambió de aseguradora"||e==="No renovada"}
function semaforo(p){
  const d=dias(p);
  if(cerrado(p))return estadoEf(p)==="No renovada"?["s-grey","No renovada"]:["s-green","Renovada"];
  if(d<0)return["s-red","Vencida hace "+(-d)+" d"];
  if(d<=15)return["s-red",d+" días"];
  if(d<=30)return["s-orange",d+" días"];
  if(d<=60)return["s-yellow",d+" días"];
  if(d<=VENTANA)return["s-green",d+" días"];
  return["s-grey","Vigente"];
}
function pill(p){const [c,t]=semaforo(p);return`<span class="pill ${c}">${esc(t)}</span>`}
function faltantes(p){const f=[];if(!p.correo)f.push("correo");if(!p.celular)f.push("celular");if(p.ramo==="Autos"&&!p.placa)f.push("placa");return f}

/* ---------- UI general ---------- */
let vista="tablero", filtros={q:"",aseg:"",ramo:"",estado:"",ventana:""};
const main=document.getElementById("main"), overlay=document.getElementById("overlay");
document.getElementById("hoy").textContent=fmtFecha(iso(HOY));
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)ir(b.dataset.v)});
function ir(v,f){vista=v;if(f)filtros=Object.assign({q:"",aseg:"",ramo:"",estado:"",ventana:""},f);
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));render();window.scrollTo(0,0)}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function render(){
  const urg=DB.polizas.filter(p=>!cerrado(p)&&dias(p)<=15).length;
  document.getElementById("tab-tablero").innerHTML="Tablero"+(urg?`<span class="count">${urg}</span>`:"");
  ({tablero:vTablero,polizas:vPolizas,renovaciones:vKanban,aseguradoras:vAseg})[vista]();
}

/* ---------- Tablero ---------- */
function vTablero(){
  const ps=DB.polizas, ab=ps.filter(p=>!cerrado(p));
  const venc=ab.filter(p=>dias(p)<0), d15=ab.filter(p=>dias(p)>=0&&dias(p)<=15), d30=ab.filter(p=>dias(p)>15&&dias(p)<=30), d60=ab.filter(p=>dias(p)>30&&dias(p)<=60);
  const ren30=ps.filter(p=>p.historial.some(h=>(HOY-parse(h.f))/DAY<=30)).length;
  const prio=ab.filter(p=>dias(p)<=30).sort((a,b)=>dias(a)-dias(b));
  const incompletos=ps.filter(p=>faltantes(p).length);
  const meses=[0,1,2].map(k=>{const d=new Date(HOY.getFullYear(),HOY.getMonth()+k,1);return d});
  const filas=meses.map(m=>{const l=ps.filter(p=>{const f=parse(p.fin);return f.getMonth()===m.getMonth()&&f.getFullYear()===m.getFullYear()&&!cerrado(p)});return{m,a:l.filter(p=>p.ramo==="Autos").length,g:l.filter(p=>generales(p.ramo)).length}});
  const max=Math.max(1,...filas.map(f=>f.a+f.g));
  main.innerHTML=`<section class="view">
  <div><h2>Vencimientos por atender</h2><p class="lead">Las alertas se calculan con la fecha de fin de vigencia registrada, sin esperar el listado de la aseguradora.</p></div>
  <div class="kpis">
    <button class="kpi k-red" data-go="vencidas" id="kpi-vencidas"><small>Vencidas sin renovar</small><b>${venc.length}</b></button>
    <button class="kpi k-red" data-go="15" id="kpi-15"><small>Vencen en 0 a 15 días</small><b>${d15.length}</b></button>
    <button class="kpi k-orange" data-go="30" id="kpi-30"><small>Vencen en 16 a 30 días</small><b>${d30.length}</b></button>
    <button class="kpi k-yellow" data-go="60" id="kpi-60"><small>Vencen en 31 a 60 días</small><b>${d60.length}</b></button>

/* ---------- Pólizas ---------- */
function filtrar(){
  const q=filtros.q.trim().toLowerCase();
  return DB.polizas.filter(p=>{
    if(q&&![p.cliente,p.numero,p.cedula,p.placa].join(" ").toLowerCase().includes(q))return false;
    if(filtros.aseg&&p.aseguradora!==filtros.aseg)return false;
    if(filtros.ramo==="Generales"&&!generales(p.ramo))return false;
    if(filtros.ramo&&filtros.ramo!=="Generales"&&p.ramo!==filtros.ramo)return false;
    if(filtros.estado&&estadoEf(p)!==filtros.estado)return false;
    const d=dias(p),ab=!cerrado(p);
    if(filtros.ventana==="vencidas"&&!(ab&&d<0))return false;
    if(filtros.ventana==="15"&&!(ab&&d>=0&&d<=15))return false;
    if(filtros.ventana==="30"&&!(ab&&d>15&&d<=30))return false;
    if(filtros.ventana==="60"&&!(ab&&d>30&&d<=60))return false;
    if(filtros.ventana==="90"&&!(ab&&d<=90))return false;
    return true;
  }).sort((a,b)=>dias(a)-dias(b));
}
function opts(arr,sel,todos){return(todos?`<option value="">${todos}</option>`:"")+arr.map(a=>`<option ${a===sel?"selected":""} value="${esc(a)}">${esc(a)}</option>`).join("")}
function vPolizas(){
  main.innerHTML=`<section class="view">

  <div class="toolbar panel">
    <label class="f" style="flex:1 1 220px">Buscar<input id="f-q" placeholder="Cliente, cédula, n.º póliza o placa" value="${esc(filtros.q)}"></label>
    <label class="f">Aseguradora<select id="f-aseg">${opts(ASEG,filtros.aseg,"Todas")}</select></label>
    <label class="f">Ramo<select id="f-ramo">${opts(["Generales",...RAMOS],filtros.ramo,"Todos")}</select></label>

    <label class="f">Vencimiento<select id="f-ventana"><option value="">Cualquiera</option>${[["vencidas","Vencidas sin renovar"],["15","0 a 15 días"],["30","16 a 30 días"],["60","31 a 60 días"],["90","Próximos 90 días"]].map(([v,t])=>`<option value="${v}" ${filtros.ventana===v?"selected":""}>${t}</option>`).join("")}</select></label>

  const pintar=()=>{const l=filtrar();
    document.getElementById("tbl").innerHTML=`<table id="tabla-polizas"><thead><tr><th>N.º póliza</th><th>Cliente</th><th>Ramo</th><th>Aseguradora</th><th>Placa</th><th>Prima</th><th>Fin vigencia</th><th>Alerta</th><th>Estado</th></tr></thead><tbody>
    ${l.map(p=>`<tr class="clickable" data-id="${p.id}"><td class="mono">${esc(p.numero)}</td><td>${esc(p.cliente)}<div style="color:var(--muted);font-size:.76rem">C.C./NIT ${esc(p.cedula)}</div></td><td><span class="tag">${esc(p.ramo)}</span></td><td>${esc(p.aseguradora)}</td><td class="mono">${esc(p.placa)||"—"}</td><td class="mono">${cop(p.prima)}</td><td class="mono">${fmtFecha(p.fin)}</td><td>${pill(p)}</td><td>${esc(estadoEf(p))}</td></tr>`).join("")||`<tr><td colspan="9" class="empty">Ninguna póliza coincide con los filtros.</td></tr>`}
    </tbody></table><p style="color:var(--muted);font-size:.8rem;margin:8px 0 0">${l.length} de ${DB.polizas.length} pólizas</p>`;
    document.querySelectorAll("#tbl tr[data-id]").forEach(tr=>tr.onclick=()=>detalle(tr.dataset.id));};
  pintar();
  document.getElementById("f-q").oninput=e=>{filtros.q=e.target.value;pintar()};
  ["aseg","ramo","estado","ventana"].forEach(k=>document.getElementById("f-"+k).onchange=e=>{filtros[k]=e.target.value;pintar()});

/* ---------- Formulario ---------- */
function formPoliza(p){
  const n=!p; p=p||{numero:"",aseguradora:ASEG[0],ramo:"Autos",cliente:"",cedula:"",correo:"",celular:"",placa:"",valor:"",prima:"",inicio:iso(HOY),fin:plusYear(iso(HOY))};
  abrir(`<header><div><h2>${n?"Registrar póliza":"Editar póliza"}</h2><p class="lead">Los campos con * son obligatorios para poder alertar el vencimiento.</p></div><button class="btn small" data-close id="cerrar">Cerrar</button></header>
  <form id="frm" class="formgrid" novalidate>
    <label class="f">N.º de póliza *<input id="p-numero" value="${esc(p.numero)}"></label>
    <label class="f">Aseguradora *<select id="p-aseguradora">${opts(ASEG,p.aseguradora)}</select></label>
    <label class="f">Ramo *<select id="p-ramo">${opts(RAMOS,p.ramo)}</select></label>
    <label class="f">Nombre completo del cliente *<input id="p-cliente" value="${esc(p.cliente)}"></label>
    <label class="f">Cédula o NIT *<input id="p-cedula" inputmode="numeric" value="${esc(p.cedula)}"></label>
    <label class="f">Correo electrónico<input id="p-correo" type="email" value="${esc(p.correo)}"></label>
    <label class="f">Celular<input id="p-celular" inputmode="tel" value="${esc(p.celular)}"></label>
    <label class="f">Placa del vehículo<input id="p-placa" value="${esc(p.placa)}" style="text-transform:uppercase"></label>
    <label class="f">Valor asegurado<input id="p-valor" inputmode="numeric" value="${esc(p.valor)}"></label>
    <label class="f">Prima *<input id="p-prima" inputmode="numeric" value="${esc(p.prima)}"></label>
    <label class="f">Inicio de vigencia *<input id="p-inicio" type="date" value="${esc(p.inicio)}"></label>
    <label class="f">Fin de vigencia *<input id="p-fin" type="date" value="${esc(p.fin)}"></label>
    <div id="frm-msg" style="grid-column:1/-1"></div>
    <div style="grid-column:1/-1;display:flex;gap:8px"><button class="btn primary" type="submit" id="p-guardar">Guardar póliza</button></div>
  </form>`);
  document.getElementById("p-inicio").onchange=e=>{const f=document.getElementById("p-fin");if(e.target.value)f.value=plusYear(e.target.value)};
  document.getElementById("frm").onsubmit=e=>{e.preventDefault();
    const v=k=>document.getElementById("p-"+k).value.trim();
    const d={numero:v("numero"),aseguradora:v("aseguradora"),ramo:v("ramo"),cliente:v("cliente"),cedula:v("cedula").replace(/\D/g,""),correo:v("correo"),celular:v("celular").replace(/\D/g,""),placa:v("placa").toUpperCase(),valor:Number(v("valor").replace(/\D/g,""))||0,prima:Number(v("prima").replace(/\D/g,""))||0,inicio:v("inicio"),fin:v("fin")};
    const err=[];
    if(!d.numero)err.push("el número de póliza");if(!d.cliente)err.push("el nombre del cliente");if(!d.cedula)err.push("la cédula o NIT");if(!d.prima)err.push("la prima");if(!d.inicio||!d.fin)err.push("las fechas de vigencia");
    if(d.ramo==="Autos"&&!d.placa)err.push("la placa (obligatoria en Autos)");
    if(d.correo&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.correo))err.push("un correo válido");
    if(d.inicio&&d.fin&&d.fin<=d.inicio)err.push("un fin de vigencia posterior al inicio");
    const dup=DB.polizas.find(x=>x.numero===d.numero&&x.aseguradora===d.aseguradora&&(n||x.id!==p.id));
    if(dup)err.push("un número que no esté repetido (ya existe en "+dup.aseguradora+")");
    const m=document.getElementById("frm-msg");
    if(err.length){m.innerHTML=`<div class="msg err" id="msg-error">Falta completar: ${esc(err.join("; "))}.</div>`;return}
    if(n){DB.polizas.push(Object.assign({id:uid(),estado:"Por gestionar",renovadaEl:"",gestiones:[{f:iso(HOY),t:"Registro",n:"Póliza registrada en la plataforma."}],cotizaciones:[],docs:[],historial:[],solicitud:{}},d));}
    else{Object.assign(p,d);p.gestiones.push({f:iso(HOY),t:"Edición",n:"Se actualizaron los datos de la póliza."});}
    save();cerrar();render();toast(n?"Póliza registrada":"Cambios guardados");
  };
}
function importar(){
  abrir(`<header><div><h2>Importar desde Excel</h2><p class="lead">Copie las filas de la hoja de cálculo actual (con encabezados) y péguelas aquí. Columnas esperadas: póliza, aseguradora, ramo, cliente, cédula, correo, celular, placa, valor asegurado, prima, inicio, fin (AAAA-MM-DD).</p></div><button class="btn small" data-close>Cerrar</button></header>
  <textarea id="imp-txt" rows="9" placeholder="póliza	aseguradora	ramo	cliente	cédula	correo	celular	placa	valor	prima	inicio	fin"></textarea>
  <div><button class="btn primary" id="imp-go">Revisar e importar</button></div><div id="imp-msg"></div>`);
  document.getElementById("imp-go").onclick=()=>{
    const filas=document.getElementById("imp-txt").value.trim().split(/\r?\n/).filter(Boolean);
    let ok=0,mal=[];
    filas.slice(1).forEach((l,i)=>{const c=l.split(/\t|;/).map(s=>s.trim());
      const [numero,aseguradora,ramo,cliente,cedula,correo,celular,placa,valor,prima,inicio,fin]=c;
      if(!numero||!cliente||!/^\d{4}-\d{2}-\d{2}$/.test(fin||"")){mal.push(i+2);return}
      if(DB.polizas.some(x=>x.numero===numero&&x.aseguradora===aseguradora)){mal.push(i+2);return}
      DB.polizas.push({id:uid(),numero,aseguradora:aseguradora||"",ramo:RAMOS.includes(ramo)?ramo:"Autos",cliente,cedula:(cedula||"").replace(/\D/g,""),correo:correo||"",celular:(celular||"").replace(/\D/g,""),placa:(placa||"").toUpperCase(),valor:Number((valor||"").replace(/\D/g,""))||0,prima:Number((prima||"").replace(/\D/g,""))||0,inicio:inicio||"",fin,estado:"Por gestionar",renovadaEl:"",gestiones:[{f:iso(HOY),t:"Registro",n:"Importada desde la hoja de cálculo."}],cotizaciones:[],docs:[],historial:[],solicitud:{}});ok++;});
    save();render();
    document.getElementById("imp-msg").innerHTML=`<div class="msg ${mal.length?"err":"ok"}">Se importaron ${ok} pólizas.${mal.length?" Filas no importadas (incompletas o repetidas): "+mal.join(", ")+".":""}</div>`;
  };
}

  <div class="panel"><h3>Documentos</h3>${p.docs.map(d=>`<div class="check"><span class="tag">PDF</span> ${esc(d)}</div>`).join("")||`<p class="lead">Sin documentos.</p>`}

  const re=()=>{save();render();detalle(id)};

    p.estado=v;p.gestiones.push({f:iso(HOY),t:"Cambio de estado",n:"Estado: "+v});re();toast("Estado actualizado");};

  };

  main.innerHTML=`<section class="view"><div><h2>Renovaciones en curso</h2><p class="lead">Pólizas que vencen en los próximos ${VENTANA} días, organizadas por etapa de gestión. Abra una tarjeta para registrar llamadas, cotizaciones o la renovación.</p></div>
  <div class="kanban" id="kanban">${ESTADOS.map(e=>{const c=l.filter(p=>estadoEf(p)===e).sort((a,b)=>dias(a)-dias(b));
    return`<div class="col"><h3><span>${e}</span><span class="mono">${c.length}</span></h3>${c.map(p=>`<div class="card" data-id="${p.id}"><div class="row"><b>${esc(p.cliente)}</b></div><div class="row"><span class="tag">${esc(p.ramo)}</span>${pill(p)}</div><div style="color:var(--muted);font-size:.78rem">${esc(p.aseguradora)} · ${cop(p.prima)}</div></div>`).join("")||`<div class="empty" style="font-size:.8rem">Sin pólizas</div>`}</div>`}).join("")}</div></section>`;
  main.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>detalle(el.dataset.id));
}

/* ---------- Aseguradoras ---------- */
let mesSel=null;
function vAseg(){
  if(!mesSel){const d=new Date(HOY.getFullYear(),HOY.getMonth()+1,1);mesSel=iso(d).slice(0,7)}
  const [y,m]=mesSel.split("-").map(Number);
  const delMes=DB.polizas.filter(p=>{const f=parse(p.fin);return f.getFullYear()===y&&f.getMonth()===m-1&&!cerrado(p)});
  const meses=[0,1,2,3].map(k=>iso(new Date(HOY.getFullYear(),HOY.getMonth()+k,1)).slice(0,7));
  const sol=DB.solicitudes[mesSel]||(DB.solicitudes[mesSel]={});
  main.innerHTML=`<section class="view">
  <div class="toolbar" style="justify-content:space-between"><div><h2>Solicitudes de renovación a las aseguradoras</h2><p class="lead">Para cada compañía se arma la lista de pólizas que vencen en el mes, de autos y de ramos generales, para pedir la renovación de todas y no solo de las que la aseguradora envíe.</p></div>
  <label class="f">Mes de vencimiento<select id="mes">${meses.map(s=>`<option value="${s}" ${s===mesSel?"selected":""}>${parse(s+"-01").toLocaleDateString("es-CO",{month:"long",year:"numeric"})}</option>`).join("")}</select></label></div>
  <div class="ins-grid">${ASEG.map(a=>{const l=delMes.filter(p=>p.aseguradora===a);if(!l.length)return"";const s=sol[a]||{};
    const au=l.filter(p=>p.ramo==="Autos").length,ge=l.length-au;
    const pend=(au&&!s.autos)||(ge&&!s.gen);
    return`<div class="panel ins"><div class="toolbar" style="justify-content:space-between"><b>${esc(a)}</b>${s.enviada?`<span class="pill ${pend?"s-orange":"s-green"}">${pend?"Respuesta pendiente":"Completa"}</span>`:`<span class="pill s-red">Sin solicitar</span>`}</div>
      <div class="nums"><span><b>${au}</b>Autos</span><span><b>${ge}</b>Generales</span></div>
      <label class="check"><input type="checkbox" data-a="${esc(a)}" data-k="autos" ${s.autos?"checked":""} ${au?"":"disabled"}>Recibido listado de autos</label>
      <label class="check"><input type="checkbox" data-a="${esc(a)}" data-k="gen" ${s.gen?"checked":""} ${ge?"":"disabled"}>Recibido listado de generales</label>
      <div class="toolbar"><button class="btn small" data-mail="${esc(a)}">Ver correo de solicitud</button><button class="btn small" data-conc="${esc(a)}">Conciliar listado</button></div></div>`}).join("")||`<p class="empty">No hay pólizas pendientes que venzan en este mes.</p>`}</div>
  </section>`;
  document.getElementById("mes").onchange=e=>{mesSel=e.target.value;render()};
  main.querySelectorAll("input[data-k]").forEach(c=>c.onchange=()=>{const s=sol[c.dataset.a]||(sol[c.dataset.a]={});s[c.dataset.k]=c.checked;save();render()});
  main.querySelectorAll("[data-mail]").forEach(b=>b.onclick=()=>correo(b.dataset.mail,delMes.filter(p=>p.aseguradora===b.dataset.mail),sol));
  main.querySelectorAll("[data-conc]").forEach(b=>b.onclick=()=>conciliar(b.dataset.conc,delMes.filter(p=>p.aseguradora===b.dataset.conc)));
}
function correo(a,l,sol){
  const mes=parse(mesSel+"-01").toLocaleDateString("es-CO",{month:"long",year:"numeric"});
  const txt=`Asunto: Solicitud de renovaciones ${mes} – S.R.J. Seguros Riesgos Jurídica\n\nBuen día, equipo ${a}:\n\nDe manera atenta solicitamos las condiciones de renovación de las siguientes pólizas que vencen en ${mes}. Agradecemos incluir tanto las pólizas de autos como las de ramos generales:\n\n`+
    l.map((p,i)=>`${i+1}. Póliza ${p.numero} · ${p.ramo} · ${p.cliente} · vence ${fmtFecha(p.fin)}${p.placa?" · placa "+p.placa:""}`).join("\n")+
    `\n\nQuedamos atentos a su respuesta.\n\nCordialmente,\nÁrea comercial\nS.R.J. Seguros Riesgos Jurídica\nYopal, Casanare`;
  abrir(`<header><div><h2>Correo de solicitud · ${esc(a)}</h2><p class="lead">Copie el texto y envíelo desde el correo de la agencia.</p></div><button class="btn small" data-close>Cerrar</button></header>
  <pre class="mail" id="mail-txt">${esc(txt)}</pre><div class="toolbar"><button class="btn primary" id="m-copy">Copiar texto</button><button class="btn" id="m-env">Marcar como enviada</button></div>`);
  document.getElementById("m-copy").onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast("Texto copiado"),()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("mail-txt"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto seleccionado; use Copiar")})};
  document.getElementById("m-env").onclick=()=>{(sol[a]||(sol[a]={})).enviada=iso(HOY);l.forEach(p=>p.gestiones.push({f:iso(HOY),t:"Correo",n:"Solicitud de renovación enviada a "+a+"."}));save();cerrar();render();toast("Solicitud marcada como enviada")};
}
function conciliar(a,l){
  abrir(`<header><div><h2>Conciliar listado · ${esc(a)}</h2><p class="lead">Pegue los números de póliza que envió la aseguradora (uno por línea o separados por comas). Se comparan con el registro de la agencia para el mes.</p></div><button class="btn small" data-close>Cerrar</button></header>
  <textarea id="cc-txt" rows="6"></textarea><div><button class="btn primary" id="cc-go">Comparar</button></div><div id="cc-res"></div>`);
  document.getElementById("cc-go").onclick=()=>{
    const env=new Set(document.getElementById("cc-txt").value.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean));
    const falta=l.filter(p=>!env.has(p.numero)), nuevos=[...env].filter(n=>!DB.polizas.some(p=>p.numero===n));
    document.getElementById("cc-res").innerHTML=`<div class="panel" style="display:grid;gap:10px">
      <div><h3>No vinieron en el listado de la aseguradora (${falta.length})</h3>${falta.map(p=>`<div class="check" style="justify-content:space-between"><span class="mono">${esc(p.numero)}</span><span>${esc(p.ramo)} · ${esc(p.cliente)}</span></div>`).join("")||"<p class='lead'>Ninguna. El listado está completo.</p>"}${falta.length?`<p class="warn" style="margin:6px 0 0">Pídalas de forma expresa para que no se queden sin renovar.</p>`:""}</div>
      <div><h3>Vinieron en el listado pero no están registradas (${nuevos.length})</h3>${nuevos.map(n=>`<div class="mono">${esc(n)}</div>`).join("")||"<p class='lead'>Ninguna.</p>"}${nuevos.length?`<p class="warn" style="margin:6px 0 0">Regístrelas para que la plataforma las alerte el próximo año.</p>`:""}</div></div>`;
  };
}

render();
window.__srj={DB:()=>DB,reset:()=>{DB={polizas:seed(),solicitudes:{}};save();render()}};
})();
</script>

</body></html>
